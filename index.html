<script>
const data = [
    // --- 1-10: מבחן לדוגמה 2026ג ---
    ["phy", "c", "דוגמה 2026ג - שאלה 1", "התייחסו לשיחת טלפון המנוהלת בין שני אנשים באמצעות מערכת הטלפוניה הציבורית (PSTN). נתון שהלולאה המקומית (Local loop) בכל אחד מהצדדים היא אנלוגית, וכל הקווים בין מרכזיות הקצה (End office) למרכזיות החיוב (Toll Office) הם קווים דיגיטליים. איזה מבין השיטות מאפשרת המרה של האות המייצג את הקול האנושי המגיע למרכזית הקצה לאות שניתן להעביר אל מרכזיית החיוב?", ["FDM (Frequency Division Multiplexing)","דגימה של האות המייצג את הקול האנושי מספיק פעמים ביחידת זמן כדי להתקרב לייצוג האנלוגי שלו","אפנון אמפליטודה","HDLC"], 1, "דוגמים את הקול האנושי (PCM) מספיק פעמים ביחידת זמן כדי לייצר אות דיגיטלי דיסקרטי שמתקרב לייצוג האנלוגי המקורי."],
    ["phy", "c", "דוגמה 2026ג - שאלה 2", "הניחו שסדרת הסיביות 010101010101 מיוצגת בקידוד NRZI. הניחו שאורך מחזור שעון הוא t מיקרו-שניות.<br>מהו אורך הזמן המירבי במיקרו-שניות שבו תהיה רמת מתח קבועה?", ["0.5t","1t","1.5t","2t"], 2, "בקידוד NRZI, סיבית 1 גורמת לשינוי מתח באמצע מחזור, וסיבית 0 שומרת על מתח קבוע. ברצף 010, נקבל חצי מחזור של 1 (לפני השינוי), מחזור שלם של 0, ועוד חצי מחזור של 1 (לפני השינוי הבא). סך הכל 1.5t."],
    ["dl", "o", "דוגמה 2026ג - שאלה 3", "בהינתן מילת מידע, מסדרים אותה במטריצה בת (m-1) שורות ו-(n-1) עמודות. לכל שורה ולכל עמודה נוסיף סיבית זוגיות. <br>א. במהלך השידור חלו שגיאות בדיוק ב-8 סיביות. האם ייתכנו מקרים בהם השגיאות לא יתגלו?<br>ב. הניחו כעת שחלו שגיאות בדיוק ב-6 סיביות. האם ייתכנו מקרים בהם השגיאות לא יתגלו?", null, 0, "א. כן, ייתכן. אם 8 השגיאות מסודרות בקודקודים של שני מלבנים (או מלבנים חופפים), הזוגיות בכל שורה ועמודה תישמר והן לא יתגלו.<br>ב. כן, ייתכן באותו אופן. אם 6 השגיאות מסודרות בקודקודים היוצרים 'לולאות' שזוגיות השורות והעמודות נשמרת (למשל מלבן עם עוד 2 נקודות שמשלימות זוגיות בשורה אחרת)."],
    ["dl", "o", "דוגמה 2026ג - שאלה 4", "שתי תחנות A ו-B. פרוטוקול חלון הזזה, חלון קבלה בגודל 1 (RWS=1). 3 סיביות למספור. מדיניות אישורים: Additional ACKs. בזמן t0 הרשת מאותחלת (חלון שליחה ריק, קבלה 0). נשלחות מסגרות 0,1,2,3 שמגיעות בהצלחה. נשלחים 4 אישורים אך רק אישור אחד מגיע בהצלחה ל-A.<br>מה המספר הגבוה ביותר שיכול להיות בראש חלון השליחה לאחר קבלת האישור?", null, 0, "התשובה היא 4. זה יקרה אם האישור היחיד שהגיע בהצלחה הוא האישור עבור מסגרת 3. מאחר וזה אישור מצטבר (Additional ACK), הוא מאשר גם את 0, 1 ו-2. לכן ראש החלון יתקדם למסגרת הבאה בתור, שהיא 4."],
    ["dl", "o", "דוגמה 2026ג - שאלה 5", "רשת CSMA/CD. אורך כבל 0.5 ק\"מ, מהירות התפשטות 200,000 ק\"מ בשנייה. <br>א. מהו זמן ההתפשטות (tau) בכבל?<br>ב. אם קצב השידור הוא 6Gbps, מהו מספר הסיביות המינימאלי במסגרת?", null, 0, "א. tau = 0.5 / 200,000 = 2.5 מיקרו-שניות.<br>ב. זמן שידור חייב להיות גדול מ-2*tau. כלומר, m / 6Gbps > 2 * 2.5us. <br>m > 5 * 10^-6 * 6 * 10^9 = 30,000. לכן המינימום הוא 30,001 סיביות."],
    ["nw", "o", "דוגמה 2026ג - שאלה 6", "טבלת ניתוב:<br><table><tr><th>קו יציאה</th><th>יעד</th></tr><tr><td>A</td><td>182.168.250.0/24</td></tr><tr><td>A</td><td>182.168.80.0/24</td></tr><tr><td>B</td><td>182.168.0.0/17</td></tr><tr><td>C</td><td>182.168.63.0/24</td></tr><tr><td>C</td><td>182.168.64.0/18</td></tr><tr><td>D</td><td>182.168.96.0/19</td></tr><tr><td>E</td><td>Default</td></tr></table>כמה כתובות יעד המתחילות ב-182.168 ינותבו דרך קו E?", null, 0, "התשובה היא 32,512. סך כל הכתובות ב-182.168 הוא 65,536. מרחב B (תחילית /17) תופס חצי מזה (32,768). מרחב B כבר 'בולע' את שורות C, D ואת אחת משורות A (80.0). שורת A הנותרת (250.0/24) תופסת 256 כתובות מהחצי השני. לכן 65536 - 32768 - 256 = 32,512."],
    ["app", "o", "דוגמה 2026ג - שאלה 7", "משתמש מקליד ftp.example.com. <br>א. כמה סגמנטים יישלחו באיתור IP אם אין CNAME בשרת המקומי (לרבות סגמנט D מהמחשב לשרת)?<br>ב. כמה יישלחו אם יש בשרת המקומי רשומת CNAME המפנה את ftp.example.com ל-example.com, ויש לו את ה-A record של example.com ב-cache?", null, 0, "א. 8 סגמנטים: 1 למקומי, 2 ל-Root, 2 ל-TLD, 2 ל-Authoritative, ו-1 חזרה למחשב.<br>ב. 2 סגמנטים: השרת המקומי יזהה את ה-CNAME, ייקח את ה-IP ישירות מה-Cache ויחזיר למחשב בסגמנט 1. יחד עם הבקשה מדובר ב-2 סגמנטים."],
    ["app", "c", "דוגמה 2026ג - שאלה 8", "ברשת טלפוניה סלולרית העושה שימוש בטכנולוגיית GSM, באיזו שיטה/ות נעשית חלוקת התדרים למשתמשים?", ["TDMA בלבד","FDMA בלבד","CDMA בלבד","שילוב של TDMA ושל FDMA"], 3, "מערכת GSM (דור 2) מחלקת את הספקטרום לתדרים (FDMA) ואז מחלקת כל תדר לחריצי זמן (TDMA)."],
    ["tp", "o", "דוגמה 2026ג - שאלה 9", "פרוטוקול TCP בין A (לקוח) ל-B (שרת). שלוש סגמנטים מ-A ל-B ברצף: (1) 1400 בתים, seq=1800. (2) 250 בתים. (3) 600 בתים.<br>אחרי סגמנט 2, מתקבל אצל A אישור עם ACK = y. האם ניתן לדעת את y? אם כן מהו, אם לא למה?", null, 0, "לא (נרשום 1-). ייתכן שהאישור מתייחס רק לסגמנט הראשון (y = 1800+1400 = 3200) וייתכן שהוא מאשר את שני הסגמנטים (y = 3200+250 = 3450)."],
    ["tp", "o", "דוגמה 2026ג - שאלה 10", "בהמשך לשאלה הקודמת: אחרי משלוח סגמנט שלישי מתקבל ACK z, ובעקבותיו *כל* החוצצים בחלון השליחה של A מתפנים.<br>האם ניתן לדעת את z?", null, 0, "כן. אם כל החוצצים התפנו, סימן ש-z מאשר את כל הבתים שנשלחו. <br>z = 1800 + 1400 + 250 + 600 = 4050."],
    
    // --- 11-20: מועד א' 2026ג ---
    ["dl", "c", "מועד א' 2026ג - שאלה 1", "שתי רשתות אתרנט: באחת Ethernet Hub ובשנייה Ethernet Switch. בנקודת זמן t0, תחנה A משדרת ל-C ובדיוק באותו זמן B משדרת ל-D. מה יקרה?", ["ברשת Hub תהיה התנגשות, ברשת Switch המסגרות ישודרו בהצלחה","בשתי הרשתות תהיה התנגשות","בשתי הרשתות השידור יצליח","ב-Hub השידור יצליח, ב-Switch תהיה התנגשות"], 0, "Hub פועל בשכבה הפיזית ומפיץ הכל לכולם, ולכן תהיה התנגשות. Switch מפריד Collision Domains (כל פורט עצמאי) ולכן שתי המסגרות יעברו בהצלחה במקביל."],
    ["phy", "o", "מועד א' 2026ג - שאלה 2", "סדרה בת 12 סיביות 010101010101 משודרת בקו באמצעות קידוד 4B/5B.<br>א. מה יהיה מספר הסיביות שישודרו לאחר הקידוד?<br>ב. האם קיימת סדרה בת 12 סיביות שלאחר הקידוד שלה תשודר רמת מתח קבועה לכל אורך זמן השידור?", null, 0, "א. בקידוד 4B/5B לכל 4 סיביות מתווספת 1 (סה\"כ 5). לכן 12 חלקי 4 זה 3. 3*5 = 15 סיביות ישודרו.<br>ב. לא (כותבים 1-). כל המטרה ב-4B/5B היא למנוע רצפים ארוכים של אפסים שיוצרים רמת מתח קבועה (בקידוד NRZI)."],
    ["dl", "c", "מועד א' 2026ג - שאלה 3", "מילות מידע בנות m סיביות מקודדות ב-CRC עם פולינום יוצר X^5 + X^3 + 1.<br>המשפט: 'ככל ש-m גדול יותר, התקורה באחוזים היא גדולה יותר'.", ["המשפט נכון","המשפט לא נכון, התקורה אינה תלויה ב-m","המשפט לא נכון, ככל ש-m גדול יותר התקורה קטנה יותר","לא נכון, תלוי בתוצאת השארית"], 2, "המשפט לא נכון. הפולינום ממעלה 5 מוסיף תמיד 5 סיביות בקרה. לכן התקורה באחוזים היא 5 / (m+5). ככל שמילת המידע m גדולה יותר, התקורה היחסית באחוזים *קטנה* יותר."],
    ["dl", "o", "מועד א' 2026ג - שאלה 4", "חלון הזזה. RWS=SWS. ראש חלון קבלה 5, חוצצים 8,9,10,11,12 מלאים (6,7 ריקים). <br>התרחש Timeout בתחנה השולחת, ונשלחו 5, 6, 7. מתוכן הגיעו בהצלחה רק 5 ו-7.<br>לאחר הטיפול, בחלון הקבלה יש שלושה חוצצים ריקים. האם ניתן לדעת כמה מסגרות הועברו לשכבת הרשת?", null, 0, "התשובה היא שלא ייתכן תרחיש כזה לפי נתוני השאלה. אם 5 הגיעה היא תועבר לרשת, חלון מתקדם. 6 עדיין חסרה, אז 7 ו-8-12 נשארים בחוצצים. הנתונים מתארים מצב שבו לא ניתן לדעת בוודאות או שיש חוסר עקביות. פתרון מודל: המקרה היחיד האפשרי שהגיעו 5,6. ואז 5-12 עוברים יחד ונוצרים 3 חוצצים ריקים."],
    ["nw", "o", "מועד א' 2026ג - שאלה 5", "ניתוב וקטור מרחק (Distance Vector) לנתב B:<br>מ-A: (0,5,7,11,4,8,2,6) | מ-C: (8,3,0,2,6,4,7,6) | מ-E: (5,2,5,6,0,2,7,9)<br>המרחק של B אל A=4, אל C=3, אל E=9.<br>מה תהיה טבלת הניתוב של B ליעדים A עד H?", null, 0, "חישוב לכל יעד - מינימום מבין (דרך A+4, דרך C+3, דרך E+9):<br>אל A: דרך A עולה 4.<br>אל B: 0.<br>אל C: דרך C עולה 3.<br>אל D: מינימום דרך C (3+2=5).<br>אל E: מינימום דרך A (4+4=8).<br>אל F: מינימום דרך C (3+4=7).<br>אל G: מינימום דרך A (4+2=6).<br>אל H: מינימום דרך C (3+6=9)."],
    ["nw", "o", "מועד א' 2026ג - שאלה 6", "הקצאת Subnetting לכתובת 182.168.75.0/24 עבור 3 רשתות: A(60), B(60), C(120). <br>הציגו הקצאה תקינה ל-x,y,z ולמיסוכים n,m,k.", null, 0, "רשת C דורשת 120 הוסטים ולכן צריכה /25 (128 כתובות). A ו-B צריכות /26 (64 כתובות כל אחת). <br>למשל:<br>C = 182.168.75.0/25 (z=0, k=25)<br>A = 182.168.75.128/26 (x=128, n=26)<br>B = 182.168.75.192/26 (y=192, m=26)"],
    ["tp", "o", "מועד א' 2026ג - שאלה 7", "דיאגרמת מצבים של TCP. הוסט A ו-B במצב ESTABLISHED. תארו את התהליך שהוביל את הוסט A למצב FIN_WAIT_2 תוך ציון הדגלים.", null, 0, "1. הוסט A מחליט לסיים את הקשר ושולח סגמנט עם דגל FIN דולק. הוא עובר למצב FIN_WAIT_1.<br>2. הוסט B מקבל את ה-FIN, שולח חזרה אישור עם דגל ACK דולק (ללא FIN עדיין).<br>3. הוסט A מקבל את ה-ACK ועובר למצב FIN_WAIT_2 (שם הוא ממתין ל-FIN מהוסט B)."],
    ["app", "o", "מועד א' 2026ג - שאלה 8", "משתמש מחפש ב-DNS את הכתובת www.openu.ac.il. מה המספר המינימאלי של סגמנטים (בקשות/תגובות) שיישלחו עד לקבלת ה-IP?", null, 0, "התשובה היא 2 סגמנטים. המינימום האפשרי יתרחש אם רשומת ה-IP של האתר כבר שמורה ב-Cache של שרת ה-DNS המקומי (Local DNS Server). המחשב שולח בקשה (סגמנט 1) והשרת משיב מיד עם ה-IP (סגמנט 2)."],
    ["app", "o", "מועד א' 2026ג - שאלה 9", "רשת אלחוטית. מחשב H1 מבצע Active Scanning בטווח של 2 נקודות גישה (AP1, AP2).<br>א. כמה מסגרות ישדר H1 בסך הכל בתהליך ההתחברות?<br>ב. כמה מסגרות ישדרו שני ה-APs יחד?", null, 0, "א. המחשב H1 ישדר 2 מסגרות: Probe Request (לחיפוש רשתות) ולאחר מכן Association Request (בקשת התחברות ל-AP שבחר).<br>ב. שני ה-APs ישדרו יחד 3 מסגרות: שניהם ישיבו ב-Probe Response (2 מסגרות), וה-AP הנבחר ישיב ב-Association Response (מסגרת 1 נוספת)."],
    ["tp", "o", "מועד א' 2026ג - שאלה 10", "זמן קצר לאחר פרסום כתבה, התקבלו בשרת סגמנטים רבים עם דגל/ים ___ מכתובות שונות. השרת השיב עם דגל/ים ___, אך מהלקוחות לא התקבל סגמנט נוסף. מדובר במתקפת ___.", null, 0, "דגלים שהתקבלו בשרת: SYN.<br>דגלים שהשרת השיב: SYN, ACK.<br>מתקפה: SYN flood (התוקף מציף בבקשות חיבור כדי למצות את חוצצי השרת מבלי להשלים את לחיצת היד המשולשת)."],

    // --- 21-29: מועד א'1 2026א ---
    ["phy", "o", "מועד א'1 2026א - שאלה 1", "דיאגרמת קונסטלציה של מודם: שני מעגלים ריכוזיים. במעגל הפנימי 4 נקודות, במעגל החיצוני 8 נקודות.<br>א. בכמה פאזות שונות משתמש המודם?<br>ב. האם מדובר באפנון פאזה בלבד?", null, 0, "א. המודם משתמש ב-12 פאזות שונות (זויות שונות מהמרכז). 4 זויות במעגל הפנימי (45,135,225,315) ו-8 במעגל החיצוני.<br>ב. לא. מכיוון שיש שני מעגלים ברדיוסים שונים, יש כאן שילוב של אפנון פאזה ואפנון אמפליטודה (QAM)."],
    ["phy", "o", "מועד א'1 2026א - שאלה 2", "קידוד מנצ'סטר (Manchester). האות מתחיל בסיבית 0. עולה בקו השעון, יורד באמצע וכו'. מהי סדרת 9 הסיביות המקודדת?", null, 0, "סדרת הסיביות היא: 011001001.<br>בקידוד מנצ'סטר: מעבר מנמוך לגבוה באמצע המחזור = 0. מעבר מגבוה לנמוך באמצע המחזור = 1."],
    ["dl", "o", "מועד א'1 2026א - שאלה 3", "קוד CRC עם פולינום יוצר ממעלה 12. התקורה היא 2%. מהו גודל מילת המידע m?", null, 0, "פולינום ממעלה 12 מוסיף בדיוק 12 סיביות בקרה לכל מילה. התקורה באחוזים היא 12 / (12+m) = 0.02. פותרים את המשוואה: 12 = 0.24 + 0.02m --> m = 588."],
    ["dl", "c", "מועד א'1 2026א - שאלה 4", "רשת עם k תחנות, הערוץ שקט ולכולן מסגרת. מה ההסתברות לשידור מוצלח ב-CSMA-p לעומת CSMA-1?", ["ב-CSMA-p ההסתברות k*p*(1-p)^(k-1), ב-CSMA-1 ההסתברות 0","בשניהם 0","ב-CSMA-p ההסתברות p, ב-CSMA-1 ההסתברות 1","ב-CSMA-p ההסתברות (1-p), ב-CSMA-1 תלויה ב-k"], 0, "ב-CSMA-p: שידור מוצלח רק אם תחנה אחת משדרת והיתר לא, ולכן k * p * (1-p)^(k-1).<br>ב-CSMA-1: כל התחנות משדרות מיד כשהערוץ מתפנה, לכן מובטחת התנגשות וההסתברות להצלחה היא 0."],
    ["nw", "c", "מועד א'1 2026א - שאלה 5", "רשת כוכב המנוהלת באלגוריתם Distance Vector. התנתק קו. האם בעיית הספירה לאינסוף עלולה להתרחש?", ["כן, תתרחש בהכרח","כן, עלולה להתרחש (תלוי בתזמון)","לא תתרחש לעולם","רק אם הצומת המרכזי נופל"], 1, "כן, עלולה להתרחש. אם קו לאחד מ'זרועות' הכוכב ניתק, הצומת המרכזי עשוי לשמוע מצומת שכן אחר (שטרם עודכן) שיש לו מסלול אל היעד, מה שיתחיל ספירה לאינסוף. התרחשותה תלויה בתזמון העדכונים."],
    ["tp", "c", "מועד א'1 2026א - שאלה 6", "A לקוח שולח UDP סגמנט X ל-B שרת. B שולח חזרה סגמנט Y. קבע: (1) שדה ה-Dest Port ב-X זהה ל-Src Port ב-Y. (2) שדה ה-Dest Port ב-X זהה ל-Dest Port ב-Y.", ["(1) נכון, (2) לא נכון","(1) לא נכון, (2) נכון","שניהם נכונים","שניהם לא נכונים"], 0, "בסגמנט X מ-A ל-B, היעד הוא השרת ולכן ה-Dest Port הוא הפורט של השרת. כשהשרת B משיב (סגמנט Y), הוא שולח מתוך הפורט שלו, ולכן ה-Src Port של Y זהה ל-Dest Port של X. טענה 2 שגויה (היעד של Y הוא הפורט הזמני של הלקוח)."],
    ["app", "c", "מועד א'1 2026א - שאלה 7", "שליחת דואר מאליס לבוב. במעבר משרת הדואר של אליס אל שרת הדואר של בוב, אילו צדדי SMTP רצים?", ["אליס צד שרת, בוב צד שרת","אליס צד לקוח, בוב צד שרת","אליס צד שרת, בוב צד לקוח","אליס צד לקוח, בוב צד לקוח"], 1, "שרת הדואר של אליס יוזם את התקשורת להעברת המייל אל השרת של בוב, ולכן הוא מתפקד כ-SMTP Client. שרת הדואר של בוב מקבל את הפנייה ופועל כ-SMTP Server."],
    ["dl", "o", "מועד א'1 2026א - שאלה 8", "פרוטוקול חלון הזזה RWS=SWS. מספור עם 9 סיביות. בזמן מסוים חוצצים 5,7,10,11,21 בחלון קבלה מלאים. ראש חלון קבלה הוא 2. מגיעות X מסגרות, ראש חלון מתקדם ל-15.<br>האם ניתן לדעת כמה מסגרות הועברו ומהם מספריהם? האם ניתן לדעת מהו X?", null, 0, "א. כן, מסגרות 2 עד 14 הועברו לשכבת הרשת ברצף (13 מסגרות). מכיוון שראש החלון הפך ל-15.<br>ב. לא ניתן לדעת מהו X במדויק. ייתכן שהגיעו הרבה יותר מסגרות שנקלטו בחוצצים שמעל 15 (כמו 16, 17) והחלון פשוט נעצר ב-15."],
    ["nw", "o", "מועד א'1 2026א - שאלה 9", "טבלת ניתוב: A=129.10.80.0/24, A=112.0/24, B=0.0/16, C=63.0/24, C=64.0/18, D=96.0/19, E=Default.<br>א. איפה תנותב 129.10.105.23? <br>ב. כמה כתובות שמתחילות ב-129.10 ינותבו ל-D?", null, 0, "א. ל-D. הכתובת נמצאת בטווח של D (129.10.96.0 עד 129.10.127.255) וזהו ה-LPM (קידומת 19 ארוכה מ-16 של B).<br>ב. ב-D יש 8,192 כתובות. אך שורת A (112.0/24) היא תת-רשת בתוך הטווח של D עם קידומת /24. נחסר 256. התשובה: 7,936 כתובות.<br>ג. אין אף כתובת 129.10 שתגיע ל-E כי שורה B (129.10.0.0/16) לוכדת את כל מה שמתחיל ב-129.10."],

    // --- 30-38: מועד א'2 2026א ---
    ["phy", "o", "מועד א'2 2026א - שאלה 1", "קבעו לגבי מערכת הטלפוניה הציבורית (PSTN):<br>א. מערכת PSTN הוקמה במקור כמערכת אנלוגית להעברת שיחות טלפון בלבד.<br>ב. כיום מבוצעת בה המרה אנלוגית-דיגיטלית גם בגלישה לאינטרנט וגם בשיחות קוליות.", null, 0, "א. נכון. הוקמה כמערכת אנלוגית טהורה לקול.<br>ב. נכון. הלולאה המקומית לבית המנוי היא לרוב אנלוגית, ומתבצעת המרה לדיגיטלי במרכזיית הקצה הן עבור שיחות והן עבור מודמים."],
    ["dl", "o", "מועד א'2 2026א - שאלה 2", "מסגרת HDLC הכוללת מידע של 200 סיביות שכולן '0'. דגלים: 11110. עושים Bit Stuffing.<br>מהו מספר הסיביות הסופי שישודר (כולל הדגלים)?", null, 0, "התשובה היא 216 סיביות. מאחר שהמידע מורכב כולו מאפסים ('0'), לעולם לא יווצר רצף של חמישה '1'-ים רצופים, לכן מנגנון ה-Bit Stuffing לא יוסיף אף סיבית למידע. מוסיפים רק שני דגלי פתיחה וסיום (5+5=10 סיביות). אם הדגל הוא 8 סיביות תקני (01111110), זה יהיה 200+16 = 216."],
    ["dl", "o", "מועד א'2 2026א - שאלה 3", "חלון הזזה RWS=1, 3 סיביות, Additional ACKs. נשלחו 0,1,2,3. מתקבל רק אישור 1 ב-A.<br>מה המספר הנמוך ביותר שיכול להיות בראש חלון השליחה כעת?", null, 0, "המספר הנמוך ביותר הוא 1. זה יקרה אם האישור היחיד שהגיע הוא עבור מסגרת 0. חלון השליחה יתקדם למסגרת הבאה בתור, שהיא 1."],
    ["dl", "c", "מועד א'2 2026א - שאלה 4", "רשת אתרנט, 2 תחנות בלבד A, B. מ-t0 לשתיהן יש תמיד מסגרות לשידור. שתיהן מאזינות לערוץ ומוצאות אותו שקט. מה יקרה?", ["תהיה התנגשות בהסתברות 0.5","תהיה התנגשות בהכרח","השידור יצליח בהסתברות 1","התנגשות בהסתברות p"], 1, "רשת אתרנט עובדת לפי CSMA/CD שהוא פרוטוקול 1-persistent (CSMA-1). כאשר הערוץ מתפנה, שתי התחנות שחיכו ישדרו באופן מיידי. מכיוון ששתיהן ישדרו מיד, בהכרח (הסתברות 1) תהיה התנגשות."],
    ["nw", "o", "מועד א'2 2026א - שאלה 5", "פרגמנטציה של פקטת IP לשתיים: פקטה ראשונה עם Offset=0, שנייה עם Offset=64 וגודל נתונים 234 בתים.<br>א. מה גודל הנתונים m בפקטה הראשונה?<br>ב. מה גודל הנתונים המקורי n לפני החלוקה?", null, 0, "א. ה-Offset מוכפל ב-8 כדי לקבל בתים. לכן m = 64 * 8 = 512 בתים.<br>ב. הפקטה המקורית מכילה את שתי הפקטות: 512 + 234 = 746 בתים."],
    ["nw", "o", "מועד א'2 2026א - שאלה 6", "א. האם בעיית ספירה לאינסוף יכולה לקרות ב-Link State?<br>ב. אם דייקסטרה מצא מסלול קצר S בין s ל-t, הוא גם מצא מסלול קצר ביותר לכל זוג צמתים שעל S.", null, 0, "א. לא נכון. ב-Link State לכל נתב יש תמונה מלאה של הטופולוגיה ולכן אין ספירה לאינסוף.<br>ב. נכון. זוהי תכונת תת-המבנה האופטימלי של דייקסטרה."],
    ["app", "c", "מועד א'2 2026א - שאלה 7", "כמו בשאלה 8 במבחן לדוגמה: טכנולוגיית GSM משתמשת בחלוקת תדרים וזמן מסוג:", ["TDMA בלבד","FDMA בלבד","שילוב TDMA ו-FDMA","CDMA בלבד"], 2, "מערכת GSM מדור 2 דיגיטלית מבצעת Multiplexing משולב: חלוקת כל הספקטרום לערוצי תדר (FDMA) וחלוקת כל ערוץ תדר ל-Time Slots שונים למנויים (TDMA)."],
    ["dl", "o", "מועד א'2 2026א - שאלה 8", "קידוד שגיאות. למילת מידע M מוסיפים סיבית זוגיות ליצירת A. מילת הקוד המשודרת היא AA.<br>א. האם יש יכולת תיקון שגיאות?<br>ב. כיצד תשתנה התשובה אם המילה המשודרת הייתה MM?", null, 0, "א. כן, יכול לתקן שגיאה 1. אם שגיאה 1 קרתה, אחד ה'חצאים' (A1 או A2) יכיל זוגיות לא תקינה. המקלט יבחר בחצי השני שהזוגיות בו תקינה.<br>ב. ל-MM תהיה יכולת גילוי בלבד. אם יש שגיאה אחת, שני החצאים יהיו שונים אבל אין דרך (ללא זוגיות) לדעת איזה חצי הוא המקורי הנכון."],
    ["tp", "o", "מועד א'2 2026א - שאלה 9", "פרוטוקול TCP, מנגנון Fast Retransmission. סגמנט שני הולך לאיבוד. בעקבות זאת משודרים 3 אישורים כפולים (Duplicate ACKs) ל-A המפעילים שידור חוזר מהיר. ה-seq הראשון היה 92 (8 בתים), אישור ראשון=100. סגמנט 2 אבד (20 בתים), סגמנט 3 (6 בתים), סגמנט 4 (15 בתים), סגמנט 5 (16 בתים).<br>א. מה ה-seq של סגמנט 5 (D)?<br>ב. מה המספר באישור הרביעי (W)?", null, 0, "א. חישוב seq: הראשון=92+8=100 (אבד). השני=100+20=120. השלישי=120+6=126. הרביעי=126+15=141. הסגמנט החמישי D הוא בעל seq=141.<br>ב. בגלל שסגמנט שני (seq 100) אבד, השרת B ימשיך לשלוח ACK 100 עבור כל סגמנט שמגיע מחוץ לסדר. לכן W = 100 (כמו שאר ה-Duplicate ACKs)."],

    // --- 39-47: מועד ב' 2026א ---
    ["phy", "o", "מועד ב' 2026א - שאלה 1", "תמונה 1920x1080. קצב שידור 60Mbps, זמן שידור 553 מילי-שניות (0.553 שניות).<br>כמה בתים (Bytes) לכל פיקסל מקודדת התמונה (ללא תקורה)?", null, 0, "חישוב סיביות כולל: 60,000,000 * 0.553 = 33,180,000 bits.<br>מספר פיקסלים: 1920 * 1080 = 2,073,600.<br>סיביות לפיקסל: 33,180,000 / 2,073,600 = 16 bits.<br>בבתים: 16 / 8 = 2 Bytes."],
    ["phy", "o", "מועד ב' 2026א - שאלה 2", "קידוד 4B/5B. סדרה בת 16 סיביות.<br>א. כמה סיביות ישודרו?<br>ב. כיצד 4B/5B משפיע על הזמן המירבי ברמת מתח קבועה בהשוואה ל-NRZI?", null, 0, "א. כל 4 סיביות הופכות ל-5, לכן 16 -> 20 סיביות ישודרו.<br>ב. 4B/5B מתוכנן במיוחד למנוע רצפי אפסים ארוכים של NRZI. הוא מבטיח שיהיו לא יותר מ-3 אפסים רצופים, לכן הזמן המירבי במתח קבוע יקטן משמעותית (מוגבל ל-4 מחזורי שעון בלבד)."],
    ["dl", "o", "מועד ב' 2026א - שאלה 3", "CRC עם הפולינום X^3 + X^2 + 1 על מילת המידע 10110010.<br>מהי מילת הקוד (כולל יתירות) המתקבלת?", null, 0, "מוסיפים 3 אפסים (מעלה 3) -> 10110010000. מחלקים בפולינום 1101 ב-XOR. השארית יוצאת 001. מילת הקוד הסופית היא 10110010001."],
    ["nw", "o", "מועד ב' 2026א - שאלה 4", "מעגל מדומה (Virtual Circuit). מתג 1 (מוצא Port3 VCI X) מתחבר למתג 2 (כניסה Port1 VCI 66). מתג 2 (מוצא Port2 VCI 22) מתחבר למתג 3 (כניסה Port2 VCI Y).<br>מהם X ו-Y?", null, 0, "X הוא זיהוי המעגל במוצא מתג 1 שכמובן חייב להתאים לכניסה במתג 2, לכן X = 66.<br>Y הוא זיהוי המעגל בכניסה של מתג 3, שהוא מקבל מהמוצא של מתג 2, לכן Y = 22."],
    ["nw", "o", "מועד ב' 2026א - שאלה 5", "אלגוריתם דייקסטרה. <br>האם כל צומת שהופך ל'פעיל' בהכרח ייכנס למסלול הקצר ביותר הסופי לאיזשהו יעד?", null, 0, "לא. צומת נבחר כפעיל כי באותו רגע הוא בעל המרחק הטנטטיבי המינימלי ממקור החישוב. אך ייתכן שיש מסלול קצר יותר אל היעדים הנותרים שלא עובר דרכו כלל. (הוא חלק מעץ המסלולים הקצרים ביותר מהמקור, אך לא בהכרח חלק מהמסלול ליעד ספציפי שנבחר)."],
    ["nw", "o", "מועד ב' 2026א - שאלה 6", "טבלת ניתוב: A=192.74.36.0/22, B=192.74.38.0/24, C=192.74.100.0/23, D=Default.<br>א. כמה ערכי x שונים יש עבורם הכתובת 192.74.x.62 תנותב ל-A?<br>ב. כמה ערכי m ינותבו ל-D?", null, 0, "א. הטווח של A (/22) מתחיל ב-36.0 עד 39.255. לכן x יכול להיות 36, 37, 38, 39. אבל 38 שייך ל-B שהוא /24 (Longest Prefix Match). לכן נשארו x = 36, 37, 39 (3 ערכים).<br>ב. הניתוב ל-D ייקח את כל ה-256 ערכים האפשריים, למעט 3 המנותבים ל-A, 1 המנותב ל-B (38), ו-2 המנותבים ל-C (100, 101). סה\"כ 256 - 6 = 250 ערכים."],
    ["app", "c", "מועד ב' 2026א - שאלה 7", "א. לקוח מקבל Base HTML משרת. הדף מפנה ל-3 תמונות. האם התמונות בהכרח על אותו השרת?<br>ב. ב-SMTP, רצף השורות: MAIL FROM -> RCPT TO -> DATA מייצג איזו פעולה?", ["א. נכון. ב. לחיצת יד משולשת","א. לא נכון. ב. בדיקת תיבות השולח והנמען","א. לא נכון. ב. שליחת גוף המייל","א. נכון. ב. פתיחת קשר TCP"], 1, "א. לא נכון. התמונות יכולות להיות על שרתי CDN שונים או אתרים אחרים (ב-URL מלא).<br>ב. בדיקת התיבות. MAIL FROM בודק את הרשאת השולח ו-RCPT TO מוודא שתיבת הנמען קיימת לפני שפותחים DATA."],
    ["tp", "o", "מועד ב' 2026א - שאלה 8", "הוסט ב-LAN (10.0.0.3, port 5466) פונה לשרת HTTP חיצוני (128.119.40.186, 80) דרך NAT (כתובת חיצונית 188.36.25.65).<br>מה תהיה כתובת היעד Y ופורט היעד Z ביציאה מה-NAT?", null, 0, "היעד לא משתנה ביציאה מ-NAT (המקור מתחלף). לכן:<br>Y = 128.119.40.186 (כתובת שרת ה-HTTP).<br>Z = 80 (פורט 80 של השרת)."],
    ["tp", "o", "מועד ב' 2026א - שאלה 9", "האם ייתכן סגמנט TCP שבו הדגלים SYN ו-FIN דלוקים בו-זמנית?", null, 0, "לא. הדגל SYN משמש אך ורק בשלב הקמת הקשר (לחיצת היד המשולשת, Sequence נשלח ראשון). הדגל FIN משמש אך ורק בשלב סיום הקשר. לא ניתן לבקש לסיים קשר לפני שבכלל הוקם."],

    // --- 48-100: Synthetic Questions (53 items) ---
    ["phy", "c", "שאלת תרגול מקורית", "על פי משפט נייקוויסט (Nyquist), מהו קצב הנתונים המקסימלי (Bit rate) של ערוץ תקשורת ללא רעש ברוחב פס של 3000Hz אם משתמשים ב-4 רמות אות (L=4)?", ["6000 bps","12000 bps","24000 bps","3000 bps"], 1, "משפט נייקוויסט קובע: BitRate = 2 * Bandwidth * log2(L). במקרה שלנו: 2 * 3000 * log2(4) = 6000 * 2 = 12000 bps."],
    ["phy", "c", "שאלת תרגול מקורית", "על פי חוק שאנון (Shannon), מה תהיה הקיבולת המרבית של ערוץ טלפון עם רוחב פס 3000Hz ויחס אות לרעש (SNR) של 31 (כ-15dB)?", ["15000 bps","12000 bps","30000 bps","6000 bps"], 0, "חוק שאנון: Capacity = B * log2(1 + SNR). לכן C = 3000 * log2(1 + 31) = 3000 * log2(32) = 3000 * 5 = 15000 bps."],
    ["phy", "c", "שאלת תרגול מקורית", "מודם עובד בשיטת QAM-64. כמה סיביות מיוצגות על ידי כל באוד (Baud) / אות בודד?", ["4 סיביות","6 סיביות","8 סיביות","64 סיביות"], 1, "ב-QAM-64 ישנן 64 נקודות קונסטלציה שונות. מספר הסיביות לסימבול הוא log2(64) = 6 סיביות לבאוד."],
    ["phy", "c", "שאלת תרגול מקורית", "באיזה תווך אופטי תופעת הנפיצה (Dispersion) היא המזערית ביותר, מה שמאפשר שידור לטווחים הארוכים ביותר?", ["סיב Multi-mode Step Index","סיב Multi-mode Graded Index","סיב Single-mode","כבל קואקסיאלי"], 2, "בסיב Single-mode (חד-אופן) יש נתיב אחד בלבד (קרן אחת) של אור העוברת בליבה דקה, מה שמונע לחלוטין Modal Dispersion (נפיצה אופנית)."],
    ["phy", "c", "שאלת תרגול מקורית", "בקידוד 8B/10B, מהו אחוז התקורה (Overhead) שנוסף למידע המשודר?", ["20%","25%","10%","15%"], 1, "עבור כל 8 סיביות מידע, נשלחות 10 סיביות. תוספת של 2 סיביות לכל 8 סיביות מידע היא תוספת של 2/8, כלומר 25% תקורה."],
    ["phy", "c", "שאלת תרגול מקורית", "מהו ההבדל המרכזי בין Baseband ל-Broadband?", ["Baseband משדר למרחקים ארוכים יותר","Broadband מאפנן את האות הדיגיטלי על גל נושא (Modulation)","אין הבדל מעשי בניהם","Baseband תומך רק בשידור סימפלקס (Simplex)"], 1, "תשובה ב. תקשורת Broadband מתבססת על אפנון (Modulation) של האות על גבי גלי נושא בתדרים שונים, מה שמאפשר הזרקת מספר ערוצים בו זמנית. Baseband משדר את האות ברמת מתח ישירה ללא אפנון."],
    ["phy", "c", "שאלת תרגול מקורית", "איזה אפנון אנלוגי מוגדר כרגיש ביותר לרעשי רקע והפרעות טבעיות?", ["FM (Frequency Modulation)","PM (Phase Modulation)","AM (Amplitude Modulation)","QAM"], 2, "באפנון AM, המידע מולבש על גובה האמפליטודה (עוצמת האות). רעשים אטמוספריים וחשמליים משפיעים ישירות על אמפליטודת האות ולכן AM רגיש יותר."],
    ["phy", "c", "שאלת תרגול מקורית", "מה התפקיד של ריבוב TDM (Time Division Multiplexing)?", ["לחלק את רוחב הפס הפיזי למספר ערוצי תדר צרים","להקצות חריצי זמן (Time Slots) למספר מקורות שידור על גבי אותו ערוץ תקשורת","לתקן שגיאות שידור בשכבה הפיזית","לשנות את פאזת הגל בהתאם לסיביות"], 1, "TDM פועל על בסיס חלוקת זמן. כל ערוץ מקבל את מלוא רוחב הפס אך רק לשבריר זמן מוגדר מראש (חריץ זמן), ברוטציה מתמדת."],
    ["phy", "c", "שאלת תרגול מקורית", "כיצד מוגדרת ניחות (Attenuation) בקו תקשורת נחושת?", ["עיוות הצורה הגלית בגלל הבדלי מהירויות התפשטות","אובדן הדרגתי של עוצמת האות (אנרגיה) ככל שהמרחק גדל","השפעה אלקטרומגנטית מכבלים סמוכים (Crosstalk)","המרת אות דיגיטלי לאנלוגי"], 1, "ניחות (Attenuation) היא הירידה האנרגטית של האות ככל שהוא מתקדם בתווך, ולרוב נמדדת בדציבלים (dB). מגברים (Repeaters) משמשים כדי להתגבר עליה."],
    ["phy", "c", "שאלת תרגול מקורית", "אם נדרש להעביר 8000 דגימות בשנייה וכל דגימה מיוצגת על ידי 8 סיביות (PCM סטנדרטי לטלפוניה), מה יהיה קצב הנתונים?", ["8000 bps","16000 bps","64000 bps","32000 bps"], 2, "הקצב יהיה: 8000 דגימות לשנייה * 8 סיביות לדגימה = 64,000 סיביות לשנייה (64 kbps)."],
    ["phy", "o", "שאלת תרגול מקורית", "מדוע כבל מסוג Twisted Pair (זוג שזור) עמיד יותר להפרעות אלקטרומגנטיות (EMI) מכבל נחושת שטוח רגיל?", null, 0, "השזירה של שני החוטים גורמת לכך שהשדות האלקטרומגנטיים החיצוניים הפוגעים בחוטים ויוצרים זרמי השראה (רעש) – נוצרים בכיוונים מנוגדים בכל חצי-סיבוב של השזירה, ולכן הם מבטלים זה את זה (Common-mode rejection)."],
    ["dl", "c", "שאלת תרגול מקורית", "מהו תפקידו המרכזי של פרוטוקול ARP (Address Resolution Protocol)?", ["ניתוב פקטות בין רשתות שונות","תרגום בין כתובת IP לכתובת פיזית (MAC Address) באותה רשת","בקשת IP משרת באופן דינמי","גילוי שגיאות במסגרת Ethernet"], 1, "ARP משמש כדי למצוא את כתובת ה-MAC הפיזית המשויכת לכתובת IP ידועה בתוך ה-LAN, כדי שניתן יהיה לארוז את הפקטה בתוך מסגרת."],
    ["dl", "c", "שאלת תרגול מקורית", "כיצד מתג (Switch) מנהל את טבלת הכתובות (MAC Table) שלו?", ["לומד על סמך כתובות ה-MAC של תחנות היעד (Destination MAC) במסגרות נכנסות","מבקש מראש מכל המחשבים ברשת את ה-MAC שלהם בעת ההפעלה","לומד על סמך כתובות ה-MAC של תחנות המקור (Source MAC) במסגרות הנכנסות","מנתב לפי כתובות IP בלבד"], 2, "מתג לומד היכן נמצא כל מחשב על ידי הסתכלות על כתובת המקור (Source MAC) והפורט שממנו נכנסה המסגרת."],
    ["dl", "c", "שאלת תרגול מקורית", "מה גודלה של כתובת MAC תקנית ברשת Ethernet?", ["32 סיביות (4 בתים)","48 סיביות (6 בתים)","64 סיביות (8 בתים)","128 סיביות (16 בתים)"], 1, "כתובת MAC היא בת 48 סיביות, לרוב מיוצגת כ-6 זוגות של תווים הקסדצימליים."],
    ["dl", "c", "שאלת תרגול מקורית", "מהי הבעיה המרכזית שפרוטוקול STP (Spanning Tree Protocol) פותר בשכבת הקו ברשתות מקומיות (LAN)?", ["בעיית התנגשויות (Collisions) ברכזת (Hub)","לולאות ניתוב (Switching Loops) בין מתגים","שגיאות CRC במסגרות","בעיית ה'תחנה הנסתרת'"], 1, "STP מזהה חוסם נתיבים עודפים (Redundant links) בטופולוגיה של מתגים, ובכך מונע היווצרות של לולאות אין-סופיות וסופות Broadcast שיקריסו את הרשת."],
    ["dl", "c", "שאלת תרגול מקורית", "המרחק של המינג (Hamming Distance) בין שתי מילות קוד הוא 5. כמה שגיאות קוד זה יכול לגלות וכמה הוא מסוגל לתקן?", ["יכול לגלות 4 שגיאות, לתקן 2 שגיאות","יכול לגלות 5 שגיאות, לתקן 1 שגיאה","יכול לגלות 2 שגיאות, לתקן 4 שגיאות","יכול לגלות ולתקן 5 שגיאות"], 0, "לפי הנוסחאות: יכולת גילוי = d-1 (כלומר 5-1=4 שגיאות). יכולת תיקון מבוססת על d = 2e+1. מאחר ו-d=5, אזי 2e+1=5 ומכאן e=2 (יכול לתקן 2 שגיאות)."],
    ["dl", "c", "שאלת תרגול מקורית", "מה תפקיד שדה ה-Preamble בתחילת מסגרת Ethernet 802.3?", ["לציין את אורך המסגרת","לסנכרן את השעונים הפיזיים של השולח והמקבל (Synchronization)","לשאת את כתובת ה-MAC של היעד","לבדוק שגיאות (CRC)"], 1, "רצף ה-Preamble (לרוב 7 בתים של 10101010) מאפשר למקלט להסתנכרן עם תדר השידור לפני שמתחיל ה-SFD ותחילת המידע הממשי."],
    ["dl", "c", "שאלת תרגול מקורית", "מדוע פרוטוקול CSMA/CD דורש אורך מסגרת מינימלי?", ["כדי להבטיח שהשולח עדיין ישדר בזמן שההתנגשות חוזרת אליו, וכך יוכל לזהות אותה","כדי להוריד את תקורת הרשת","כדי לעבור מתגים ונתבים ללא שגיאות","בגלל מגבלות זיכרון של הרכזות (Hubs)"], 0, "אורך מינימלי מבטיח שזמן השידור (T) יהיה ארוך מזמן הלוך ושוב (2*tau), כך שאם התנגשות מתרחשת בקצה הרחוק ביותר, האות החוזר יגיע לשולח לפני שסיים לשדר."],
    ["dl", "c", "שאלת תרגול מקורית", "כיצד אלגוריתם Binary Exponential Backoff עובד לאחר התנגשות שלישית?", ["ממתין 3 מחזורי זמן קבועים","מגריל זמן המתנה מתוך הטווח 0 עד 3","מגריל זמן המתנה מתוך הטווח 0 עד 7","מפסיק את השידור וזורק את החבילה"], 2, "לאחר התנגשות ה-i, הטווח להגרלה הוא בין 0 ל- 2^i - 1. אחרי התנגשות 3, הטווח הוא 0 עד 2^3 - 1 = 7 (כלומר מגריל בין 0 ל-7 מחזורי אפיק)."],
    ["dl", "c", "שאלת תרגול מקורית", "ברשתות אלחוטיות (802.11) משתמשים ב-CSMA/CA (הימנעות) ולא CD (גילוי) בעיקר בגלל:", ["מגבלת רוחב הפס ברשת אלחוטית","בעיית 'התחנה הנסתרת' וחוסר היכולת לשדר ולהאזין במקביל (Half-duplex) בתדר אחד","בגלל עדיפות לוידאו ואודיו","כדי למנוע פריצות סייבר"], 1, "משדר אלחוטי לא יכול לשמוע התנגשויות באוויר בזמן שהוא משדר (האות שלו חזק בהרבה). בנוסף, התחנות עשויות שלא לשמוע אחת את השנייה (Hidden Terminal)."],
    ["dl", "o", "שאלת תרגול מקורית", "הסבירו מה תפקיד הודעות RTS (Request to Send) ו-CTS (Clear to Send) ברשתות 802.11.", null, 0, "זהו מנגנון Reservation המסייע לפתור את 'בעיית התחנה הנסתרת'. תחנה הרוצה לשדר שולחת RTS (קטן). ה-AP (נקודת הגישה) משיב ב-CTS המודיע ל*כל* התחנות בסביבה (כולל אלו הנסתרות מהמשדר) להשתיק שידורים עד שהתחנה המקורית תסיים להעביר את הנתונים."],
    ["dl", "c", "שאלת תרגול מקורית", "כאשר חלון הקבלה (RWS) מוגדר לגודל 1, והשולח יכול לשלוח מספר רב של מסגרות (SWS>1) מבלי להמתין לאישור על כל אחת – מדובר בפרוטוקול מסוג:", ["Stop and Wait","Go-Back-N (GBN)","Selective Repeat","ALOHA"], 1, "ב-Go-Back-N השולח בעל חלון גדול (SWS>1) והמקבל מאשר מסגרות לפי הסדר בלבד ויש לו רק חוצץ אחד (RWS=1). כל מסגרת שמגיעה מחוץ לסדר נזרקת."],
    ["nw", "c", "שאלת תרגול מקורית", "מהו התפקיד של שדה ה-TTL (Time to Live) ב-IPv4 Header?", ["לציין את גרסת ה-IP","לציין כמה שניות המנות יכולות להישאר בראוטר לפני שידור","למנוע מפצלות לטייל לנצח ברשת על ידי הפחתת הערך בכל נתב עד שמגיע ל-0","לתעדף פקטות (QoS)"], 2, "כל נתב שמקבל פקטה מוריד 1 מערך ה-TTL. אם הערך מגיע ל-0, הנתב משמיד את הפקטה (זורק אותה) ושולח ICMP Time Exceeded כדי למנוע לולאות ניתוב אינסופיות."],
    ["nw", "c", "שאלת תרגול מקורית", "פקודה traceroute משתמשת בשדה ____ במכוון כדי לגלות את הנתיב.", ["Protocol","Fragment Offset","TTL","Type of Service"], 2, "Traceroute שולח פקטות עם TTL=1, 2, 3... וכך מקבל הודעות שגיאה (ICMP) מכל נתב בדרך, מה שמאפשר לו למפות את כל הקפיצות עד ליעד."],
    ["nw", "c", "שאלת תרגול מקורית", "לרשת יש מסכת רשת (Subnet Mask) 255.255.255.192. כמה הוסטים (מחשבים חוקיים) היא יכולה להכיל?", ["64","62","128","126"], 1, "192 בבינארי משאיר 2 סיביות אחרונות (מתוך הבית האחרון) + ה-6 הקודמות לא רלוונטי? לא. בבית הרביעי, 192 הוא 11000000. נותרו 6 סיביות להוסטים (64 אפשרויות). נחסר את כתובת הרשת וכתובת ה-Broadcast, ולכן 64 - 2 = 62 הוסטים חוקיים."],
    ["nw", "c", "שאלת תרגול מקורית", "פרוטוקול BGP (Border Gateway Protocol) נחשב לפרוטוקול מסוג:", ["Link State Routing","Distance Vector פשוט","Path Vector (Exterior Gateway Protocol)","Interior Gateway Protocol (IGP)"], 2, "BGP משמש לניתוב בין-מערכתי (בין Autonomous Systems). הוא מחליף מסלולים שלמים (Path Vector) כדי להימנע מלולאות וכדי לאפשר מדיניות ניתוב פוליטית/כלכלית עשירה."],
    ["nw", "c", "שאלת תרגול מקורית", "מה מהבאים נכון לגבי פרוטוקול OSPF?", ["פועל כ-Exterior Gateway Protocol (EGP)","מבוסס על אלגוריתם Link State (דייקסטרה) למציאת המסלול הקצר ביותר","משתמש בספירת דילוגים (Hop Count) כמטריקה יחידה","עובד באמצעות החלפת טבלאות ניתוב מלאות עם השכנים כל 30 שניות"], 1, "OSPF הוא פרוטוקול Link State. נתבים מפיצים מידע (LSA) לכלל הרשת וכל נתב בונה עץ מסלולים קצרים (דייקסטרה) על סמך משקלות המשקפים רוחב פס/מהירות."],
    ["nw", "c", "שאלת תרגול מקורית", "בפקטת IPv4, דגל DF (Don't Fragment) דולק (1). הראוטר צריך להעביר את הפקטה ללינק שה-MTU שלו קטן מגודל הפקטה. מה הראוטר יעשה?", ["יפצל את הפקטה למרות הדגל","יכווץ את המידע בפקטה על ידי דחיסה","יזרוק את הפקטה (Drop) וישלח ICMP Destination Unreachable","יתעלם מגודל ה-MTU וישדר את הפקטה בשלמותה"], 2, "כאשר דגל DF דלוק, לראוטר אסור לפצל את הפקטה. מכיוון שהיא גדולה מדי ללינק הבא, הראוטר חייב לזרוק אותה ולדווח חזרה לשולח באמצעות הודעת ICMP."],
    ["nw", "c", "שאלת תרגול מקורית", "מה גודלה של כתובת IPv6 סטנדרטית?", ["32 סיביות","64 סיביות","128 סיביות","256 סיביות"], 2, "כתובת IPv6 היא בגודל 128 סיביות (16 בתים), ומיוצגת כרצף של 8 קבוצות של מספרים הקסדצימליים."],
    ["nw", "c", "שאלת תרגול מקורית", "בטבלת ניתוב, כיצד נהוג לייצג את 'נתיב ברירת המחדל' (Default Route) בשיטת CIDR?", ["255.255.255.255/32","0.0.0.0/0","127.0.0.1/8","192.168.0.0/16"], 1, "נתיב Default מיוצג עם קידומת /0 (כלומר שום סיבית לא חייבת להתאים), מה שמבטיח שזו השורה עם ההתאמה הקצרה ביותר (תשמש רק אם אין אף התאמה אחרת בטבלה)."],
    ["nw", "o", "שאלת תרגול מקורית", "הסבירו מה תפקיד פרוטוקול ICMP (Internet Control Message Protocol) בשכבת הרשת.", null, 0, "פרוטוקול המשמש לדיווח על שגיאות ובקשות שליטה. נתבים והוסטים משתמשים בו כדי לדווח על מנות שלא ניתן לנתב, חריגת זמן TTL (time exceeded), בעיות בפיצול (Fragmentation needed), וכדי לבדוק קישוריות (Echo request/reply ב-Ping)."],
    ["nw", "o", "שאלת תרגול מקורית", "כיצד פועל אלגוריתם Link State לעומת Distance Vector בעת עדכוני ניתוב?", null, 0, "ב-Link State כל צומת מפיץ לכל הצמתים ברשת את המצב של הקישורים *שלו בלבד* (מידע חלקי בתפוצה מלאה). ב-Distance Vector כל צומת שולח לשכנים הישירים *שלו בלבד* את מרחבי הניתוב *השלמים שלו* (מידע מלא בתפוצה חלקית)."],
    ["tp", "c", "שאלת תרגול מקורית", "האם פרוטוקול UDP (User Datagram Protocol) מבטיח מסירת נתונים ללא שגיאות ולפי הסדר?", ["כן, הוא פרוטוקול אמין (Reliable)","לא, הוא פרוטוקול שאינו מבטיח הגעה כלל, ללא בקרת זרימה או בקרת גודש","כן, הוא מבטיח הגעה אך לא מבטיח סדר","לא, אך יש לו בקרת גודש (Congestion Control) מובנית"], 1, "UDP הוא פרוטוקול חסר קשר (Connectionless) ולא אמין. הוא שולח פקטות מהר ככל האפשר ללא מנגנון ACKs, רה-שידורים, או בקרות כלשהן."],
    ["tp", "c", "שאלת תרגול מקורית", "איזה תהליך מכונה 'לחיצת יד משולשת' (3-Way Handshake) ב-TCP?", ["שלבי ניתוק הקשר: FIN, ACK, FIN-ACK","שלבי אישור מנה: DATA, ACK, ACKs","שלבי הקמת הקשר: SYN, SYN-ACK, ACK","תקשורת עם שלושה שרתים שונים בו זמנית"], 2, "הקמת הקשר מתחילה בלקוח שולח SYN, השרת מאשר ושולח בקשת SYN משלו (SYN-ACK), והלקוח מסיים עם ACK. תהליך זה מסנכרן את מספרי ה-Sequence."],
    ["tp", "c", "שאלת תרגול מקורית", "מה גודל ה-Header הסטנדרטי והמינימלי של סגמנט TCP וסגמנט UDP?", ["TCP=8 בתים, UDP=8 בתים","TCP=20 בתים, UDP=8 בתים","TCP=20 בתים, UDP=20 בתים","TCP=32 בתים, UDP=16 בתים"], 1, "תקורה של UDP היא זעירה ומכילה רק 8 בתים. תקורה של TCP היא הרבה יותר גדולה (לפחות 20 בתים) בגלל צורך בשדות Sequence, ACK, דגלים, חלון ועוד."],
    ["tp", "c", "שאלת תרגול מקורית", "מהו מנגנון NAT / PAT (Port Address Translation) נפוץ?", ["תרגום כתובות IPv6 ל-IPv4 בלבד","שימוש בכתובת IP חיצונית אחת ומספרי פורטים (Ports) שונים כדי לאפשר למספר מחשבים ברשת פנימית לצאת לאינטרנט","הצפנת תוכן ה-Data לפני שליחה לאינטרנט","חסימת פורטים (חומת אש / Firewall)"], 1, "NAT/PAT מתרגם כתובת IP מקומית ופורט יציאה מקומי לכתובת ה-IP הציבורית ולפורט ממופה חדש, ובכך חוסך בכתובות IP ציבוריות (IPv4)."],
    ["tp", "c", "שאלת תרגול מקורית", "בשלב ה-Slow Start של בקרת הגודש ב-TCP, כיצד גדל חלון הגודש (cwnd)?", ["באופן אקספוננציאלי חזק (מוכפל פי 2 עבור כל RTT או גדל ב-MSS על כל ACK)","באופן לינארי פשוט (מוסיפים MSS אחד בכל RTT)","באופן רנדומלי בין 1 ל-5 MSS","לא גדל כלל אלא נשאר קבוע"], 0, "למרות השם המטעה 'התחלה איטית', בשלב זה חלון הגודש מתחיל ב-1 MSS ומכפיל את עצמו בכל RTT (אקספוננציאלי) עד שמגיע לסף הגודש (ssthresh)."],
    ["tp", "c", "שאלת תרגול מקורית", "בשלב Congestion Avoidance ב-TCP, כאשר החלון הגיע לסף, כיצד הוא ממשיך לגדול?", ["לינארית (גדל בערך 1 MSS עבור כל חלון שלם של ACKs)","ממשיך אקספוננציאלית","יורד בחצי באופן קבוע","מפסיק לגדול (קבוע)"], 0, "במניעת גודש, העלייה הופכת ללינארית וזהירה (Additive Increase) – תוספת של 1 MSS על כל מחזור הלוך-ושוב (RTT) כדי למצוא בעדינות את קיבולת הרשת המקסימלית."],
    ["tp", "c", "שאלת תרגול מקורית", "מהו תפקיד שדה ה-Receive Window (rwnd) המצורף על ידי המקבל ב-Header של TCP?", ["מציין כמה סגמנטים התקבלו עם שגיאות","מספק Flow Control (בקרת זרימה) ומודיע לשולח כמה מקום פנוי נותר בחוצץ הקבלה","משמש כגודל מפתח ההצפנה של המידע","מגדיר את אורך החבילה הפיזית במנות IP"], 1, "בקרת הזרימה מוודאת שהשולח (המהיר) לא יציף את המקבל (האיטי). ה-rwnd מודיע ל-TCP השולח את 'מקום הפנוי' לאחסון מידע אצל הלקוח."],
    ["tp", "o", "שאלת תרגול מקורית", "מדוע TCP כולל מצב TIME_WAIT, בו הוא ממתין זמן כפול מאורך חיי סגמנט ממוצע (2MSL) לפני סגירה סופית של הקשר?", null, 0, "כדי לוודא שה-ACK האחרון שנשלח (באישור ה-FIN האחרון) אכן הגיע. אם ה-ACK האחרון אבד, הצד השני ישלח FIN חוזר, שיוכל להתקבל בטווח הזמן הזה. בנוסף, זה מונע מסגמנטים ישנים שנתקעו ברשת להתערבב בחיבור חדש (עם אותם פורטים) שאולי יפתח מיד."],
    ["tp", "o", "שאלת תרגול מקורית", "מהו ה-Pseudo Header (פסידו-פתיח) ש-TCP ו-UDP כוללים בעת חישוב ה-Checksum שלהם?", null, 0, "זהו פתיח וירטואלי המכיל את כתובות ה-IP של המקור והיעד (נלקח משכבת הרשת) ואת סוג הפרוטוקול. המטרה היא לוודא בשכבת התובלה שהסגמנט לא הגיע אל המחשב הלא-נכון בגלל שגיאת ניתוב או שינוי כתובת IP בשכבה למטה."],
    ["tp", "c", "שאלת תרגול מקורית", "אפליקציה צריכה להעביר הזרמת וידאו (Streaming/VoIP) בזמן אמת, כשהשהיה (Latency) קריטית יותר מאיבוד חבילות פה ושם. באיזה פרוטוקול תבחר?", ["TCP","UDP","SMTP","HTTP"], 1, "UDP נבחר להזרמת מדיה בזמן אמת מכיוון שאין בו מנגנוני לחיצת יד, אגרות (ACKs) ורה-שידורים, שיוצרים השהיות ארוכות ולא סדירות."],
    ["app", "c", "שאלת תרגול מקורית", "באיזה פורט דיפולטיבי יעבוד שרת HTTP ואיזה שרת HTTPS?", ["HTTP: 80, HTTPS: 443","HTTP: 21, HTTPS: 22","HTTP: 8080, HTTPS: 8443","HTTP: 25, HTTPS: 110"], 0, "פורט 80 מוקצה כברירת מחדל לתקשורת גלויה ברשת ו-443 לתקשורת HTTP מוצפנת ומאובטחת ב-SSL/TLS."],
    ["app", "c", "שאלת תרגול מקורית", "מה המשמעות של התנהגות Persistent Connections (קשר עקבי) שהוגדרה כברירת מחדל בפרוטוקול HTTP/1.1?", ["השרת שומר לוג של כל הפניות לנצח","על אותו קשר TCP שנפתח ניתן להעביר מספר רב של בקשות ותגובות HTTP (ללא פתיחה וניתוק מחדש)","הלקוח והשרת מחליפים מפתחות הצפנה באופן עקבי","TCP ינסה להתחבר מחדש אוטומטית כשהרשת נופלת"], 1, "חיבור עקבי חוסך את התקורה של 'לחיצות היד' (3-Way Handshake) של TCP עבור כל בקשה נפרדת (תמונות, קבצי CSS וכו') באותו העמוד."],
    ["app", "c", "שאלת תרגול מקורית", "פרוטוקול DHCP (Dynamic Host Configuration Protocol) משמש ל:", ["המרה בין שמות דומיין לכתובות IP","מניעת וירוסים בשכבת היישום","הקצאה דינאמית של כתובות IP ונתוני רשת (כגון Default Gateway) ללקוחות שמצטרפים ל-LAN","קביעת נתיבים אוטומטית בין נתבי ליבה באינטרנט"], 2, "כאשר המחשב נדלק/מתחבר הוא מפיץ הודעת Broadcast (DHCP Discover) ושרת ה-DHCP 'מלווה' (Lease) לו כתובת IP לעבודה ברשת."],
    ["app", "c", "שאלת תרגול מקורית", "מה ההבדל המרכזי בין שימוש בפרוטוקול POP3 לפרוטוקול IMAP עבור משיכת דוא\"ל משרת?", ["אין הבדל משמעותי, שניהם באותו פורט","POP3 מוחק לרוב את המיילים מהשרת אחרי ההורדה, IMAP מסנכרן מצב כשהמיילים נשארים בשרת","IMAP משמש רק למשלוח ו-POP3 רק לקבלה","POP3 תומך בהצפנה ו-IMAP לא"], 1, "IMAP מודרני יותר ותוכנן לעבודה במקביל עם מספר מכשירים (סמארטפון, טאבלט, מחשב) תוך שמירת עץ התיקיות ומצב הקריאה (Sync) מול השרת."],
    ["app", "c", "שאלת תרגול מקורית", "איזו רשומת DNS (DNS Record) נדרשת כדי לתרגם שם דומיין לכתובת IPv6?", ["A record","MX record","CNAME record","AAAA record"], 3, "רשומת A מתרגמת שם ל-IPv4, ורשומת AAAA מתרגמת לכתובת הארוכה יותר של IPv6 (128 ביט)."],
    ["app", "c", "שאלת תרגול מקורית", "כיצד פועלות העוגיות (Cookies) ב-HTTP?", ["הן תוכנות קטנות שרצות על שרת ה-HTTP כדי לנתח נתונים","אלו פקטות TCP חסרות Sequence Number","HTTP הוא פרוטוקול 'חסר מצב' (Stateless), והעוגיות מאפשרות לשרת 'לזכור' ולהזהות משתמשים דרך מידע קטן שנשמר בלקוח","הן חלק ממנגנון ההצפנה (SSL) ב-HTTPS"], 2, "השרת מייצר את העוגייה עם מזהה ושולח ללקוח, הדפדפן שומר אותה, ומצרף אותה אוטומטית לכל הבקשות הבאות שלו לאותו שרת."],

const tNames = {
    "phy": "שכבה פיזית, קידודים ו-PSTN",
    "dl": "שכבת קו נתונים (MAC, חלון הזזה, CRC)",
    "nw": "שכבת רשת וניתוב",
    "tp": "שכבת תובלה ו-NAT",
    "app": "שכבת יישום ואלחוטי"
};

let solved = new Set();

function renderQuestions() {
    const filter = document.getElementById('filter').value;
    const container = document.getElementById('q-container');
    
    // סינון שאלות
    const filteredData = data.map((q, idx) => ({ q, idx })).filter(item => filter === 'all' || item.q[0] === filter);
    
    // עדכון כמות השאלות בסטטוס
    document.getElementById('stats').innerText = `פתרת: ${solved.size} / ${data.length}`;
    
    let html = '';
    filteredData.forEach((item, displayIdx) => {
        const i = item.idx; // המזהה המקורי הייחודי של השאלה
        const q = item.q;
        
        let optsHtml = '';
        if (q[1] === 'c') { // שאלות אמריקאיות
            optsHtml = `<div class="opts">
                ${q[4].map((opt, optIdx) => `
                    <label>
                        <input type="radio" name="q_${i}" value="${optIdx}">
                        <span>${opt}</span>
                    </label>
                `).join('')}
            </div>`;
        } else { // שאלות פתוחות
            optsHtml = `<textarea rows="3" placeholder="כתוב את תשובתך / הסברך כאן..."></textarea>`;
        }
        
        html += `
        <div class="qb" id="box_${i}">
            <div class="qh">
                <span>${q[2] ? q[2] : 'שאלה ' + (displayIdx + 1)}</span>
                <span class="bdg ${q[1] === 'o' ? 'open' : ''}">${tNames[q[0]]}</span>
            </div>
            <h3>${displayIdx + 1}. ${q[3]}</h3>
            ${optsHtml}
            <button class="btn" onclick="checkAnswer(${i})">בדוק תשובה / הצג פתרון</button>
            <div id="fb_${i}" class="fb"></div>
        </div>`;
    });
    
    container.innerHTML = html;
}

function checkAnswer(i) {
    const fb = document.getElementById(`fb_${i}`);
    fb.style.display = 'block';
    const q = data[i];
    
    if (q[1] === 'o') { // שאלה פתוחה
        fb.className = 'fb c';
        fb.innerHTML = `<strong>פתרון מודל מלא והסבר:</strong><br>${q[6]}`;
        addScore(i);
    } else { // שאלה סגורה
        const sel = document.querySelector(`input[name="q_${i}"]:checked`);
        
        if (!sel) {
            fb.className = 'fb w';
            fb.innerHTML = 'אנא בחר/י תשובה לפני הבדיקה.';
            return;
        }
        
        const userAns = parseInt(sel.value);
        if (userAns === q[5]) { // תשובה נכונה
            fb.className = 'fb c';
            fb.innerHTML = `<strong>תשובה נכונה! כל הכבוד.</strong><br><br><strong>הסבר:</strong> ${q[6]}`;
            addScore(i);
        } else { // תשובה שגויה
            fb.className = 'fb w';
            fb.innerHTML = `<strong>תשובה שגויה.</strong><br><br><strong>הסבר למודל:</strong> ${q[6]}`;
        }
    }
}

function addScore(i) {
    if (!solved.has(i)) {
        solved.add(i);
        document.getElementById('stats').innerText = `פתרת: ${solved.size} / ${data.length}`;
    }
}

// Render on first load
window.onload = renderQuestions;
</script>
